# Upstream socket definition for Gunicorn WSGI
upstream sony_backend_upstream {
    server unix:/run/gunicorn-sony-backend.sock fail_timeout=0;
}

# Redirect HTTP (Port 80) to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name sonyfeedingkurtis.com www.sonyfeedingkurtis.com api.sonyfeedingkurtis.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sonyfeedingkurtis.com www.sonyfeedingkurtis.com api.sonyfeedingkurtis.com;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/sonyfeedingkurtis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonyfeedingkurtis.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum file upload size (supporting high-resolution catalog imagery)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static Assets (collected via python manage.py collectstatic)
    location /static/ {
        alias /var/www/sonyfeedingkurtis/sony-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # User Uploaded Media (catalog images, product gallery)
    location /media/ {
        alias /var/www/sonyfeedingkurtis/sony-backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Django Admin Panel & API Reverse Proxy
    location ~ ^/(api|admin)/ {
        proxy_pass http://sony_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Frontend React Single Page Application (SPA)
    location / {
        root /var/www/sonyfeedingkurtis/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML not cached so app updates load immediately
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Static assets hashed by Vite cached for 1 year
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }
}
